<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbital Dodge — resurrected</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, #020617 55%);
        color: #e2e8f0;
      }
      .shell {
        width: min(420px, 92vw);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(15, 23, 42, 0.85);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
      }
      .badge {
        color: #86efac;
        font-weight: 600;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #0f172a;
        cursor: none;
      }
      footer {
        display: flex;
        justify-content: space-between;
        padding: 10px 16px 14px;
        font-size: 11px;
        color: rgba(226, 232, 240, 0.65);
      }
      kbd {
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <span>Orbital Dodge</span>
        <span class="badge">Resurrected · v0.1.0</span>
      </header>
      <canvas id="game" width="400" height="320" aria-label="Orbital Dodge game"></canvas>
      <footer>
        <span>Move mouse · dodge debris · collect cores</span>
        <span id="score">Score 0</span>
      </footer>
    </div>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const W = canvas.width;
      const H = canvas.height;

      let score = 0;
      let player = { x: W / 2, y: H / 2, r: 10 };
      let hazards = [];
      let cores = [];
      let frame = 0;

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        player.x = ((e.clientX - rect.left) / rect.width) * W;
        player.y = ((e.clientY - rect.top) / rect.height) * H;
      });

      function spawnHazard() {
        hazards.push({
          x: Math.random() * W,
          y: -20,
          r: 8 + Math.random() * 10,
          vy: 1.5 + Math.random() * 2.5,
        });
      }

      function spawnCore() {
        cores.push({
          x: 20 + Math.random() * (W - 40),
          y: -16,
          r: 6,
          vy: 1.2 + Math.random() * 1.2,
        });
      }

      function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function loop() {
        frame += 1;
        if (frame % 28 === 0) spawnHazard();
        if (frame % 55 === 0) spawnCore();

        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, W, H);

        for (let i = hazards.length - 1; i >= 0; i -= 1) {
          const h = hazards[i];
          h.y += h.vy;
          ctx.fillStyle = "#f87171";
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
          ctx.fill();
          if (dist(player, h) < player.r + h.r) {
            score = Math.max(0, score - 5);
            hazards.splice(i, 1);
            continue;
          }
          if (h.y > H + 30) hazards.splice(i, 1);
        }

        for (let i = cores.length - 1; i >= 0; i -= 1) {
          const c = cores[i];
          c.y += c.vy;
          ctx.fillStyle = "#86efac";
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
          ctx.fill();
          if (dist(player, c) < player.r + c.r + 4) {
            score += 10;
            cores.splice(i, 1);
            continue;
          }
          if (c.y > H + 20) cores.splice(i, 1);
        }

        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
        ctx.fill();

        scoreEl.textContent = `Score ${score}`;
        requestAnimationFrame(loop);
      }

      loop();
    </script>
  </body>
</html>
